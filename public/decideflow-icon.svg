<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="df-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3A86FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="100" height="100" rx="24" fill="url(#df-bg)" stroke="#222F3E" stroke-width="2"/>
  
  <!-- Flow Tree Nodes & Connectors -->
  <!-- Top Root Node -->
  <circle cx="50" cy="24" r="9" fill="url(#df-grad)"/>
  
  <!-- Connector Lines -->
  <path d="M50 33 L50 46" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 46 L30 58" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 46 L70 58" stroke="#3A86FF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch Nodes -->
  <circle cx="30" cy="62" r="8" fill="#00E5FF" />
  <circle cx="70" cy="62" r="8" fill="#3A86FF" />
  
  <!-- Bottom Connector to Decision Output -->
  <path d="M30 70 L46 80" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="3,3" stroke-linecap="round"/>
  <path d="M70 70 L54 80" stroke="#7000FF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Final Decision Golden Target -->
  <circle cx="50" cy="81" r="7" fill="#00F5D4"/>
  <path d="M47 81 L49.5 83.5 L53.5 78.5" fill="none" stroke="#0D1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
